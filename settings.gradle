pluginManagement {
    repositories {
        // NeoForged first: ModDevGradle lives here, and resolving through Maven Central
        // needlessly rate-limits (HTTP 429) behind a proxy.
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://libraries.minecraft.net' }
        gradlePluginPortal()
    }
}

plugins {
    // Downloads the right JDK when this machine lacks one (26.x needs Java 25).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://libraries.minecraft.net' }
        mavenCentral()
    }
}

rootProject.name = 'buddymod'
