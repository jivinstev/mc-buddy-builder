# Target: Minecraft 26.2 (NeoForge 26.2.x). Select with -Pmc=26.2 or MC_TARGET=26.2.
#
# Mojang left the 1.x numbering after 1.21.11: 26.1, 26.1.1, 26.1.2, then 26.2.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.75
# MC 26.x requires Java 25. Gradle downloads it if this machine lacks it.
java_version=25
overlay=mc26
# 26.x has no @GameTest annotation. Tests stay annotated in shared source and a
# generator wires them up for this target (tools/buddy/gametest_adapter.py).
gametest_adapter=on
