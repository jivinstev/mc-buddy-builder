name: check
on:
  push:
  pull_request:
jobs:
  private-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test
        run: python3 tools/check-private-terms.py --self-test
      - name: Files
        run: python3 tools/check-private-terms.py
      - name: Every commit message and author
        run: python3 tools/check-private-terms.py --commits HEAD
      - name: Settings parse
        run: python3 -c "import json; json.load(open('.claude/settings.json'))"
      - name: Making a mod never stops for approval
        run: python3 tools/buddy/test_permissions.py
      - name: Rename tool
        run: python3 tools/buddy/test_rename_mod.py
      - name: Setup script
        run: python3 tools/buddy/test_setup.py
      - name: Texture tool
        run: python3 tools/buddy/test_make_texture.py
      - name: README cloud steps match cloud/
        run: python3 cloud/check_readme.py
