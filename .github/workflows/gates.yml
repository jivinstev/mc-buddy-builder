name: gates
# Gates A, B and C on both Minecraft versions. Free on a public repo.
# In your own copy: CI runs A and B by default. Set the repository variable
# RUN_GATE_C=true (Settings > Secrets and variables > Actions > Variables) to add Gate C.
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '26.2']
    env:
      MC: ${{ matrix.mc }}
      FULL: ${{ github.repository == 'jivinstev/mc-buddy-builder' || vars.RUN_GATE_C == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Gate A (build + unit tests)
        run: ./gradlew build -Pmc=$MC --console=plain
      - name: Gate B (GameTests on a real server)
        run: ./tools/gate-b.sh
      - name: Install a virtual display
        if: env.FULL == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri
      - name: Gate C (a real client)
        if: env.FULL == 'true'
        run: SIG=$RUNNER_TEMP/client ./tools/client-test.sh
      - name: Keep the photo and logs
        if: always() && env.FULL == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-${{ matrix.mc }}
          path: ${{ runner.temp }}/client
          if-no-files-found: ignore
