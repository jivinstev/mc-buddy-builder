org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

loader_version_range=[1,)

# The mod's own name. `./setup` (or /name-my-mod) rewrites these four lines when you
# name your mod, along with the Java package and the asset folders. Change them by hand
# only if you also move src/main/java/com/buddymod and assets/buddymod.
mod_id=buddymod
mod_name=Buddy Mod
mod_version=1.0.0
mod_group_id=com.buddymod
mod_license=MIT

# minecraft_version / neo_version / java_version are NOT here: they are per-target data in
# versions/<target>.properties. Pick a target with -Pmc=<target>, or set MC_TARGET in
# .env.local (./setup does this for you). With neither, the build targets 26.2.
